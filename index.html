<style>
:root{
  --bg:#fdf2f8;--bg2:#fce7f3;--card:#ffffff;--card2:#fff7fb;--line:rgba(219,39,119,.2);
  --ink:#3b0a24;--mute:#9d4f74;--acc:#db2777;--acc-ink:#ffffff;--acc-soft:rgba(219,39,119,.10);--acc2:#f472b6;
  --shadow:0 10px 30px rgba(219,39,119,.12);--edge:#5b1238;
  --t-read:#047857;--t-read-bg:rgba(16,185,129,.12);
  --t-sight:#0369a1;--t-sight-bg:rgba(14,165,233,.12);
  --t-mimic:#6d28d9;--t-mimic-bg:rgba(139,92,246,.10);
  --t-me:#b45309;--t-me-bg:rgba(245,158,11,.14);
  --good:#16a34a;--warn:#ea580c;--pause:#2563eb;
}
body.theme-boy{
  --bg:#070810;--bg2:#0d1020;--card:#181b32;--card2:#1f2340;--line:rgba(158,255,31,.18);
  --ink:#eef2ff;--mute:#9aa3c7;--acc:#9EFF1F;--acc-ink:#0b1200;--acc-soft:rgba(158,255,31,.10);--acc2:#FF66C4;
  --shadow:0 10px 30px rgba(0,0,0,.45);--edge:#000000;
  --t-read:#4ade80;--t-read-bg:rgba(74,222,128,.13);
  --t-sight:#38bdf8;--t-sight-bg:rgba(56,189,248,.13);
  --t-mimic:#c4a5ff;--t-mimic-bg:rgba(167,139,250,.14);
  --t-me:#fbbf24;--t-me-bg:rgba(251,191,36,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden;transition:background .4s}
body.theme-girl{background:radial-gradient(1200px 600px at 90% -10%,#fbcfe8 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#fce7f3 0,transparent 60%),var(--bg)}
body.theme-boy{background:radial-gradient(1000px 600px at 85% -10%,rgba(158,255,31,.08) 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,102,196,.07) 0,transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:'Noto Naskh Arabic',serif}
.naskh{font-family:'Noto Naskh Arabic',serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.wrapf{flex-wrap:wrap}
.between{justify-content:space-between}
.center{justify-content:center;align-items:center;text-align:center}
.grow{flex:1}
.card{background:var(--card);border:3px solid var(--edge);border-radius:10px;box-shadow:4px 4px 0 var(--edge);padding:16px}
body.theme-girl .card{background:rgba(255,255,255,.82);backdrop-filter:blur(10px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--acc-soft);color:var(--acc);border:1px solid var(--line)}
body.theme-girl .pill{color:#be185d}
.h1{font-size:34px;font-weight:800;line-height:1.25}
.h2{font-size:24px;font-weight:800;line-height:1.3}
.h3{font-size:19px;font-weight:700}
.mute{color:var(--mute)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:8px;font-weight:800;font-size:17px;background:var(--acc);color:var(--acc-ink);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn:focus-visible,.chip:focus-visible,.tb:focus-visible{outline:3px dashed var(--acc2);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--ink)}
.icon-btn{padding:5px 8px}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:12px}
.btn.lg{padding:14px 28px;font-size:21px;border-radius:20px}
.chip{padding:7px 13px;border-radius:8px;border:2px solid var(--line);background:var(--card2);font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);transform:translateY(-2px)}
body.theme-girl .chip.on{color:#be185d}
.grid{display:grid;gap:12px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s ease both}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* ===== reading tags ===== */
.tt{font-family:'Noto Naskh Arabic',serif;line-height:2.1}
.w{display:inline;border-radius:7px;padding:0 2px;cursor:pointer;transition:background .15s}
.tags-on .w.t-read{color:var(--t-read);background:var(--t-read-bg);font-weight:700}
.tags-on .w.t-sight{color:var(--t-sight);background:var(--t-sight-bg);font-weight:700}
.tags-on .w.t-mimic{color:var(--t-mimic);background:var(--t-mimic-bg);text-decoration:underline dotted 2px;text-underline-offset:8px}
.tags-on .w.t-me{color:var(--t-me);background:var(--t-me-bg);font-weight:800}
.slot{border:2px dashed var(--t-me);border-radius:10px;padding:0 4px;margin:0 1px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-size:14px;font-weight:700}
.lg .sq{display:inline-block;width:10px;height:10px;background:currentColor;border-radius:2px}
.lg.read{color:var(--t-read);background:var(--t-read-bg)}
.lg.sight{color:var(--t-sight);background:var(--t-sight-bg)}
.lg.mimic{color:var(--t-mimic);background:var(--t-mimic-bg)}
.lg.me{color:var(--t-me);background:var(--t-me-bg)}

/* ===== top bar / harvest ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;background:linear-gradient(135deg,#FF66C4,#9EFF1F);color:#14001a}
.harvest{position:fixed;bottom:0;left:0;right:0;z-index:45;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1.5px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.hv{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hv::-webkit-scrollbar{display:none}
.hslot{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;border:1.5px dashed var(--line);opacity:.45;font-size:14px;font-weight:700;white-space:nowrap}
.hslot.on{opacity:1;border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.hslot .naskh{font-size:15px}
.pad-bottom{padding-bottom:110px}


/* ===== game ===== */
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
.game{position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));background:#1d2b1a;overflow:hidden}
.game canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.qlog{position:absolute;top:10px;right:10px;background:rgba(255,253,245,.94);color:#2a1d24;border:3px solid #2a1d24;border-radius:8px;box-shadow:3px 3px 0 #2a1d24;padding:8px 12px;font-size:14px;max-width:270px}
.qlog .qi{display:flex;gap:6px;align-items:center;line-height:1.5}
.qlog .qi.done{opacity:.45;text-decoration:line-through}
.qlog .qi.next{font-weight:800;color:#b5179e}
.placebar{position:absolute;top:10px;left:10px;background:#2a1d24;color:#fff;border-radius:8px;padding:6px 12px;font-weight:800;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.dpad{position:absolute;bottom:14px;left:14px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;direction:ltr}
.dpad button{background:rgba(255,253,245,.9);border:3px solid #2a1d24;border-radius:10px;font-size:20px;font-weight:900;color:#2a1d24;box-shadow:2px 2px 0 #2a1d24;touch-action:none;user-select:none}
.talk{position:absolute;bottom:20px;left:0;right:0;margin:0 auto;width:max-content;animation:floaty 1.4s infinite}
.rpg{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;justify-content:center}
.rpg .box{width:min(900px,100%);background:#fffdf5;color:#2a1d24;border:4px solid #2a1d24;border-radius:10px;box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;max-height:70vh;overflow:auto}
body.theme-boy .rpg .box{background:#181b32;color:#eef2ff;border-color:#9EFF1F}
.rpg .portrait{flex:0 0 auto;background:#cfe8ff;border:3px solid #2a1d24;border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
body.theme-boy .rpg .portrait{background:#0d1020;border-color:#9EFF1F}
.rpg .nm{font-weight:800;font-family:'Noto Naskh Arabic',serif}
.panel-bg{position:fixed;inset:0;z-index:60;background:rgba(8,6,20,.62);display:flex;align-items:flex-start;justify-content:center;padding:70px 12px 70px;overflow:auto}
.panel{width:min(1040px,100%);background:var(--card);border:4px solid var(--edge);border-radius:12px;box-shadow:6px 6px 0 var(--edge);padding:16px}
body.theme-girl .panel{background:#fffafd}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px dashed var(--line);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.lobby-av{background:linear-gradient(#bfe3ff,#d8f5c9);border:4px solid var(--edge);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;height:190px;box-shadow:4px 4px 0 var(--edge)}

/* ===== quick road ===== */
.road{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:4px;padding:58px 10px 10px;border:4px solid var(--edge);border-radius:12px;box-shadow:4px 4px 0 var(--edge);background:linear-gradient(#bfe3ff 0,#bfe3ff 46%,#79c257 46%,#79c257 100%);overflow:hidden}
body.theme-boy .road{background:linear-gradient(#1b2350 0,#1b2350 46%,#2f6b2a 46%,#2f6b2a 100%)}
.road-track{position:absolute;left:20px;right:20px;top:86px;height:10px;background:#d3cabb;border-top:3px solid #2a1d24;border-bottom:3px solid #2a1d24}
.stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.stop .disc{width:48px;height:48px;border-radius:8px;background:#fffdf5;border:3px solid #2a1d24;display:grid;place-items:center;box-shadow:2px 2px 0 #2a1d24}
.stop.done .disc{background:#b9f6a5}
.stop.cur .disc{background:#ffd60a}
.stop .lbl{font-size:13px;font-weight:800;color:#2a1d24;background:rgba(255,253,245,.9);border-radius:6px;padding:0 6px;white-space:nowrap}
.stop .walker{position:absolute;top:-56px;animation:floaty 1s infinite}
.teacher-tip{background:var(--acc-soft);border:2px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{min-width:140px;min-height:110px;padding:12px 18px;border-radius:10px;background:var(--card2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translate(3px,3px);box-shadow:none}
.opt-t{font-size:30px;font-weight:700}
.opt-n{font-size:56px;font-weight:800;line-height:1}
.word-big{font-size:64px;line-height:1.4}
.say-line{font-size:40px;text-align:center;line-height:1.9}
@media (max-width:720px){.stop .lbl{font-size:10px;padding:0 2px}.stop .disc{width:36px;height:36px}.opt{min-width:100px}.say-line{font-size:28px}.road-track{top:80px}}
.cue{background:#ffe066;border-radius:6px;box-shadow:0 0 0 2px #2a1d24;padding:0 3px}
.tags-on .cue .w,.cue{color:#2a1d24 !important}
.tags-on .cue .w{background:transparent;text-decoration:none}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-card{display:flex;align-items:center;gap:10px;text-align:right;padding:8px 12px;border-radius:10px;border:3px solid var(--edge);background:var(--card2);color:var(--ink);font-size:22px;box-shadow:2px 2px 0 var(--edge);min-height:58px}
.qa-card.sel{background:#fff3b0;color:#2a1d24}
.qa-card.ok{background:#c9f7b8;color:#2a1d24;opacity:.85}
@media (max-width:720px){.qa-grid{grid-template-columns:1fr}.qa-card{font-size:19px}}
/* ===== modal ===== */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,6,15,.62);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{max-width:720px;width:100%;max-height:90vh;overflow:auto}

/* ===== chat bubbles ===== */
.bub{max-width:88%;padding:10px 16px;border-radius:20px;font-size:23px;position:relative;border:1.5px solid var(--line)}
.bub.them{background:var(--card2);align-self:flex-start;border-bottom-right-radius:6px}
.bub.me{background:var(--acc-soft);align-self:flex-end;border-bottom-left-radius:6px;border-color:var(--acc)}
.bub .amm{font-size:16px;color:var(--mute);border-top:1px dashed var(--line);margin-top:6px;padding-top:4px;font-family:'Baloo Bhaijaan 2'}
.who{font-size:14px;font-weight:800;color:var(--mute);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.ok-stamp{position:absolute;top:-10px;left:-10px;background:var(--good);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.25)}

/* ===== teacher bar ===== */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;border-radius:16px;background:var(--card2);border:1.5px dashed var(--line)}
.tbar .lbl{font-size:13px;font-weight:800;color:var(--mute);padding:0 4px}
.tb{padding:7px 12px;border-radius:8px;font-weight:800;font-size:15px;color:#fff;display:inline-flex;gap:6px;align-items:center;border:2px solid rgba(0,0,0,.45);box-shadow:2px 2px 0 rgba(0,0,0,.45)}
.tb:active{transform:translateY(3px);box-shadow:none}
.tb.g{background:var(--good)}.tb.w{background:var(--warn)}.tb.p{background:var(--pause)}

/* ===== energy ===== */
.energy{height:26px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);position:relative;overflow:visible}
.energy .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s cubic-bezier(.3,1.5,.5,1)}
.energy .rk{position:absolute;top:-2px;transition:right .5s cubic-bezier(.3,1.5,.5,1);transform:translateX(50%)}

/* ===== flip card ===== */
.flip{perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.flip .b{transform:rotateY(180deg)}

/* ===== vault viruses ===== */
.vfield{position:relative;height:330px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 120%,var(--acc-soft),transparent 60%),var(--card2);border:1.5px solid var(--line)}
.virus{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;animation:drift 6s ease-in-out infinite}
.virus .v{font-size:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.virus .vl{font-weight:800;background:#ef4444;color:#fff;border-radius:10px;padding:0 8px;font-size:15px}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}33%{transform:translate(18px,-14px) rotate(5deg)}66%{transform:translate(-14px,10px) rotate(-2deg)}}

/* ===== wheel ===== */
.wheel{transition:transform 3.2s cubic-bezier(.17,.89,.23,1)}

/* ===== misc ===== */
.bigword{font-family:'Noto Naskh Arabic',serif;font-size:72px;font-weight:700;line-height:1.5}
.emoji-xl{font-size:84px;line-height:1}
.ladder-step{border-radius:16px;padding:10px 14px;border:2px solid var(--line);background:var(--card2);transition:all .3s}
.ladder-step.on{border-color:var(--acc);background:var(--acc-soft)}
.ladder-step.lock{opacity:.35}
.idcard{border-radius:24px;padding:18px;border:3px solid var(--acc);background:linear-gradient(135deg,var(--card),var(--card2));min-height:200px}
.slotbox{min-height:46px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;padding:4px 10px}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:80;background:var(--acc);color:var(--acc-ink);padding:10px 20px;border-radius:16px;font-weight:800;box-shadow:var(--shadow);animation:pop .35s both}
.fab{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:50;padding:6px 12px;border-radius:8px;background:var(--card);color:var(--ink);border:3px solid var(--edge);font-weight:800;box-shadow:3px 3px 0 var(--edge)}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(420px,92vw);z-index:70;background:var(--card);border-left:2px solid var(--line);box-shadow:var(--shadow);overflow:auto;padding:18px;animation:fade .25s}
#err{position:fixed;inset:auto 10px 10px 10px;z-index:9999;background:#7f1d1d;color:#fff;padding:12px 16px;border-radius:12px;font:14px/1.5 monospace;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto;direction:ltr;text-align:left}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0d1020;color:#fff;z-index:9998;font-family:'Baloo Bhaijaan 2',sans-serif}
#boot .sp{width:48px;height:48px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:#FF66C4;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hubgrid{grid-template-columns:260px 1fr}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:720px){
  .hubgrid{grid-template-columns:1fr}
  .hide-sm{display:none}
  .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .qlog{max-width:180px;font-size:12px}
  .rpg .portrait{display:none}
  .h1{font-size:26px}.h2{font-size:20px}
  .bub{font-size:20px}
  .bigword{font-size:54px}
  .wrap{padding:12px}
  .sim{height:calc(100vh - 170px)}
  .mlist{min-width:0;max-width:170px;font-size:12px}
}

/* ===== كتابة ياسين ===== */
.kb{display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none;margin-top:4px}
.kb .r{display:flex;gap:4px;justify-content:center;direction:rtl}
.kb button{flex:1 1 0;min-width:0;max-width:54px;height:44px;border-radius:8px;background:var(--card2);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge);font-family:'Noto Naskh Arabic',serif;font-size:21px;font-weight:700;color:var(--ink);padding:0;touch-action:manipulation}
.kb button:active{transform:translate(2px,2px);box-shadow:none}
.kb .wide{max-width:none;flex:5;font-family:'Baloo Bhaijaan 2';font-size:15px}
.kb .mid{max-width:none;flex:1.7;font-family:'Baloo Bhaijaan 2';font-size:15px}
.kb .mk{font-size:24px;color:var(--acc)}
.kbtog{font-size:13px}
.wbox{width:100%;font-family:'Noto Naskh Arabic',serif;font-size:23px;line-height:1.9;padding:10px 14px;border-radius:10px;border:3px solid var(--edge);background:var(--card2);color:var(--ink);resize:vertical;direction:rtl;min-height:70px}
.wbox:focus{outline:3px solid var(--acc);outline-offset:1px}
.winput{width:100%;font-family:'Noto Naskh Arabic',serif;font-size:21px;padding:6px 12px;border-radius:8px;border:3px solid var(--edge);background:var(--card2);color:var(--ink);direction:rtl}
.winput:focus{outline:3px solid var(--acc)}
.checks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ck{padding:3px 10px;border-radius:999px;border:2px dashed var(--line);font-weight:700;font-size:14px;color:var(--mute);transition:all .2s}
.ck.on{border-style:solid;border-color:var(--good);color:var(--good);background:rgba(22,163,74,.12)}
.ck.no{border-style:solid;border-color:var(--warn);color:var(--warn);background:rgba(234,88,12,.12)}
.trick{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:8px;background:rgba(234,88,12,.12);border:2px solid var(--warn);font-weight:800;font-size:15px}
.trick .naskh{font-size:18px}
.papercard{background:#fffdf5;color:#2a1d24;border:3px solid #2a1d24;border-radius:8px;padding:14px 18px;font-family:'Noto Naskh Arabic',serif;font-size:23px;line-height:2.1;box-shadow:4px 4px 0 #2a1d24;position:relative}
.papercard .pin{position:absolute;top:-9px;right:50%;width:16px;height:16px;border-radius:50%;background:#e2483d;border:3px solid #2a1d24}
.papercard .ttl{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:16px;color:#7c4a1e;border-bottom:2px dashed #d4c39e;margin-bottom:4px}
.seg{cursor:pointer;border-radius:6px;padding:0 3px;transition:background .2s}
.seg:hover{background:rgba(58,123,213,.14)}
.seg.hit{background:rgba(22,163,74,.22)}
.seg.miss{background:rgba(234,88,12,.3)}
.seg .tagk{font-family:'Baloo Bhaijaan 2';font-size:12px;font-weight:800;color:#16a34a;vertical-align:super;margin-inline-start:2px}
.wa{background:#0b141a;border:3px solid var(--edge);border-radius:12px;overflow:hidden;color:#e9edef}
.wa-head{background:#1f2c34;padding:8px 12px;display:flex;gap:10px;align-items:center}
.wa-av{width:38px;height:38px;border-radius:50%;background:#2a3942;display:grid;place-items:center;overflow:hidden}
.wa-body{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:42vh;min-height:160px;overflow:auto;background:#0b141a}
.wa .m{max-width:86%;padding:5px 12px 7px;border-radius:10px;font-family:'Noto Naskh Arabic',serif;font-size:20px;line-height:1.85;white-space:pre-wrap;animation:fade .3s both}
.wa .m.in{background:#202c33;align-self:flex-start;border-top-right-radius:2px}
.wa .m.out{background:#005c4b;align-self:flex-end;border-top-left-radius:2px}
.wa .m .nm{display:block;font-family:'Baloo Bhaijaan 2';font-size:13px;font-weight:800;line-height:1.4}
.wa .typing{align-self:flex-start;color:#8696a0;font-size:14px;padding:2px 8px}
.wa-foot{background:#111b21;padding:10px;border-top:1px solid #222d34}
.wa-foot .wbox{background:#2a3942;color:#e9edef;border-color:#2a3942}
.todo{list-style:none;display:flex;flex-direction:column;gap:6px}
.todo li{display:flex;gap:10px;align-items:center;padding:6px 12px;border-radius:8px;background:var(--card2);border:2px solid var(--line);font-family:'Noto Naskh Arabic',serif;font-size:20px}
.todo li .bx{width:20px;height:20px;border:3px solid var(--edge);border-radius:4px;flex:0 0 auto;background:var(--card)}
.todo li .no{font-family:'Baloo Bhaijaan 2';font-weight:800;color:var(--acc);min-width:22px}
.todo li.pick{cursor:pointer}
.todo li.pick:hover{border-color:var(--acc)}
.todo li.used{opacity:.35}
.phone-btn{position:relative}
.phone-btn .dot{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:10px;background:#e2483d;color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--edge);animation:floaty 1.2s infinite}
.vline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strike{text-decoration:line-through;text-decoration-color:#e2483d;text-decoration-thickness:2px}
@media (max-width:720px){
  .kb button{height:40px;font-size:18px;border-width:1.5px;box-shadow:1px 1px 0 var(--edge)}
  .wbox{font-size:20px}
  .papercard{font-size:19px}
